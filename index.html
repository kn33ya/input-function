<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
<p>
  <label for="petal-color">petal color</label>
  <input id="petal-color" type="color" value="#e8577e" />
  <output for="petal-color"></output>
</p>
 
<p>
  <label for="petal-x">petal x</label>
  <input id="petal-x" type="range" min="-200" max="200" value="0" />
  <output for="petal-x"></output>
  <label for="petal-y">petal y</label>
  <input id="petal-y" type="range" min="-200" max="200" value="0" />
  <output for="petal-y"></output>
</p>
 
<p>
  <label for="petal-scale">petal scale</label>
  <input id="petal-scale" type="range" min="0.3" max="2" step="0.1" value="1" />
  <output for="petal-scale"></output>
</p>
 
<p>
  <label for="petal-skew-x">petal skew x</label>
  <input id="petal-skew-x" type="range" min="-60" max="60" value="0" />
  <output for="petal-skew-x"></output>
  <label for="petal-skew-y">petal skew y</label>
  <input id="petal-skew-y" type="range" min="-60" max="60" value="0" />
  <output for="petal-skew-y"></output>
</p>
 
<div id="bg">
  <div id="stem"></div>
  <div id="rightLeaf"></div>
  <div id="leftLeaf"></div>
  <div id="petals">
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
    <div class="petal"></div>
  </div>
  <div id="center"></div>
</div>
</body>
</html>
